# Task runner config
# mise is installed via Nix, or you can install it via https://mise.jdx.dev/
# Run tasks with: mise run <task> or mise <task>

[env]
# Load from .env file (copy .env.example to .env)
_.file = ".env"

[tasks.nix-switch]
description = "Build & activate this host's profile"
depends = ["fmt", "fast-switch"]

[tasks.nix-upgrade]
description = "Update flake inputs and switch"
run = "nix flake update && mise gc && mise nix-switch"

[tasks.fast-switch]
alias = "fs"
description = "Switch without formatting, for rapid iteration"
depends = ["_check-git"]
run = "./scripts/darwin-switch.sh"

[tasks.nix-build]
alias = "b"
description = "Build this host's profile"
depends = ["_check-git"]
run = "darwin-rebuild --flake \".#${FLAKE_HOST:-$(hostname)}\" build"

[tasks.fmt]
description = "Format nix files"
run = "nixfmt *.nix **/*.nix"

[tasks.fmt-check]
description = "Check nix formatting"
run = "nixfmt --check *.nix **/*.nix"

[tasks.check]
description = "Run checks"
depends = ["fmt-check", "pi-check"]

[tasks.pi-check]
description = "Lint and test pi extensions"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd config/llm/pi
echo "==> biome check"
biome check .
echo "==> tsc --noEmit"
tsc --noEmit
echo "==> bun test"
bun test
"""

[tasks.pi-fmt]
description = "Format pi extensions"
run = "cd config/llm/pi && biome check --write ."

[tasks.nix-diff]
description = "Diff this host's closure against current system"
run = """
#!/usr/bin/env bash
nix build ".#darwinConfigurations.${FLAKE_HOST:-$(hostname)}.system" -o ./new-system
nvd --color always diff /run/current-system ./new-system | less -FR
rm ./new-system
"""

[tasks.repl]
description = "Start a REPL with flake outputs"
run = """
nix repl --expr 'let
  flake = builtins.getFlake "'$(pwd)'";
  pkgs = flake.inputs.nixpkgs.legacyPackages.${builtins.currentSystem}; in
  { inherit flake pkgs; inherit (pkgs) lib; configs = flake.darwinConfigurations // flake.nixosConfigurations; }'
"""

[tasks.nixos-build-image]
alias = "nbi"
description = "Build a NixOS VM disk image (usage: mise nbi -- [hostname] [variant])"
depends = ["_check-git", "_ensure-builder"]
raw = true
run = """
#!/usr/bin/env bash
set -euo pipefail
host="${1:?Usage: mise nbi -- <hostname> [variant]}"
variant="${2:-qemu-efi}"
# GC the builder before building -- with auto-GC disabled, old builds accumulate
echo "Collecting garbage on linux-builder..."
sudo ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    -o IdentitiesOnly=yes -i /etc/nix/builder_ed25519 -p 31022 \
    builder@localhost 'nix-collect-garbage' 2>/dev/null || true

echo "Building $variant image for $host..."
nix build ".#nixosConfigurations.$host.config.system.build.images.$variant" --print-build-logs
echo ""
echo "Image built:"
ls -lh result/

# Stop the linux-builder to free resources (~8GB RAM)
mise run nixos-builder-stop
"""

[tasks.nixos-utm]
alias = "nbu"
description = "Build NixOS image and create/replace UTM VM (usage: mise nbu -- [hostname] [variant])"
depends = ["_check-git", "_ensure-builder"]
raw = true
run = "./scripts/nixos-utm.sh"

[tasks.nixos-remote-switch]
alias = "nrs"
description = "Deploy NixOS config to a remote host via SSH (usage: mise nrs -- <hostname> [target])"
depends = ["_check-git", "_ensure-builder"]
raw = true
run = "./scripts/nixos-switch-remote.sh"

[tasks.windows-utm]
alias = "nwu"
description = "Download Windows 11 ARM64 and create UTM VM (usage: mise nwu -- [options])"
raw = true
run = "./scripts/windows-utm.sh"

[tasks.nixos-builder-start]
alias = "nbs"
description = "Start the linux-builder VM"
run = "sudo launchctl bootstrap system /Library/LaunchDaemons/org.nixos.linux-builder.plist 2>/dev/null || echo 'Already running'"

[tasks.nixos-builder-stop]
alias = "nbt"
description = "Stop the linux-builder VM (frees ~16GB RAM)"
run = "sudo launchctl bootout system/org.nixos.linux-builder 2>/dev/null || echo 'Already stopped'"

[tasks.nixos-builder-reset]
alias = "nbr"
description = "Reset the linux-builder VM (recreates disk after config changes)"
run = "./scripts/nixos-builder-reset.sh"

[tasks.gc]
description = "Garbage-collect the Nix store (usage: mise gc -- 60)"
run = """
#!/usr/bin/env bash
age="${1:-60}"
sudo nix-collect-garbage --delete-older-than "${age}d"
nix-collect-garbage --delete-older-than "${age}d"
"""

[tasks."tailscale:push-acl"]
alias = "ts-push"
description = "Push Tailscale ACL policy to the admin console"
run = "./tailscale/push-acl.sh"

[tasks._ensure-builder]
hide = true
description = "Ensure the linux-builder VM is running"
run = "./scripts/ensure-linux-builder.sh"

[tasks._check-git]
hide = true
description = "Check for untracked flake files"
run = """
#!/usr/bin/env bash
untracked=$(git ls-files --others --exclude-standard '*.nix' '*/*.nix' 'config/**' 'secrets/*.yaml')
if [[ -n "$untracked" ]]; then
    echo "Error: Untracked files found (flakes only see git-tracked files):"
    echo "$untracked" | sed 's/^/  /'
    echo "Run 'git add' on these files first."
    exit 1
fi
"""
